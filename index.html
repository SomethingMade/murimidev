<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Vuzora</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111113" id="mt">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cdefs%3E%3ClinearGradient id=%22vzg%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%23FF5A3C%22/%3E%3Cstop offset=%221%22 stop-color=%22%23D4145A%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2232%22 height=%2232%22 rx=%229%22 fill=%22%23E32B2B%22/%3E%3Cpath d=%22M7.5 9.5L16 24l8.5-14.5%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%223.2%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M13.6 11.5l5.2 3.3-5.2 3.3z%22 fill=%22%23fff%22/%3E%3C/svg%3E">
<style>
:root{--red:#E32B2B;--bg:#111113;--s2:#1E1E21;--s3:#2C2C31;--ln:#2C2C31;--tx:#F1F1F1;--mu:#AAA;--link:#3EA6FF;--hot:#FF4E45;color-scheme:dark}
[data-theme=light]{--red:#E32B2B;--bg:#FFF;--s2:#F2F2F2;--s3:#E5E5E5;--ln:#E5E5E5;--tx:#0F0F0F;--mu:#606060;--link:#065FD4;--hot:#C00;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h2{margin:0 0 12px}
.top{position:fixed;inset:0 0 auto;height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;display:flex;align-items:center;gap:12px;background:var(--bg);z-index:10}
.logo{display:flex;align-items:center;gap:6px;font-weight:700;font-size:20px;letter-spacing:-.04em}
.logo svg{width:30px;height:30px}
.ic{width:20px;height:20px;flex:none;display:block}
.btn .ic{width:18px;height:18px}
form.s{flex:1;max-width:600px;margin:0 auto;display:flex}
.s input{flex:1;min-width:0;height:40px;padding:0 16px;border:1px solid var(--ln);border-radius:20px 0 0 20px;background:var(--bg);outline:0}
.s button{width:56px;height:40px;border:1px solid var(--ln);border-left:0;border-radius:0 20px 20px 0;background:var(--s2)}
.btn{height:36px;padding:0 16px;border-radius:18px;background:var(--s2);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--s3)}
.btn.p,.btn.on{background:var(--tx);color:var(--bg)}
.btn[disabled]{opacity:.5;pointer-events:none}
.lk{color:var(--link);font-weight:500}
aside{position:fixed;top:56px;bottom:0;left:0;width:200px;padding:12px;background:var(--bg)}
aside a,aside button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px}
aside a:hover,aside a.on,aside button:hover{background:var(--s2)}
main{margin-left:200px;padding:calc(72px + env(safe-area-inset-top)) 24px 40px}
.chips{display:flex;gap:12px;overflow-x:auto;margin-bottom:20px;scrollbar-width:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:8px;background:var(--s2);font-weight:500}
.chip.on{background:var(--tx);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:40px 16px}
.th{display:block;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--s2);position:relative}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.pvv{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;border-radius:0;object-fit:cover;pointer-events:none}
.d{position:absolute;z-index:1;right:6px;bottom:6px;background:#000c;color:#fff;font-size:12px;padding:1px 5px;border-radius:4px}
.m{display:flex;gap:12px;margin-top:12px}
.m>div{min-width:0;flex:1}
.av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;object-fit:cover}
.t{font-weight:600;font-size:16px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mu{color:var(--mu);font-size:13px}
.w{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
video{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;display:block}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0}
.row .r{margin-left:auto;display:flex;gap:8px}
.box{background:var(--s2);border-radius:12px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.rel{display:flex;gap:8px;margin-bottom:12px}
.rel .th{width:168px;flex:none;border-radius:8px}
.cm{display:flex;gap:12px;margin:16px 0}
.cm>div{flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
textarea,.f input,.f select{width:100%;border:1px solid var(--ln);background:var(--bg);border-radius:10px;padding:10px;outline:0}
textarea{min-height:60px;resize:vertical}
.f label{display:grid;gap:6px;margin-bottom:14px;font-weight:600}
.bar{height:6px;background:var(--s2);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#F03}
.ov{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:16px;z-index:50}
.sh{width:min(400px,100%);background:var(--bg);border:1px solid var(--ln);border-radius:16px;padding:22px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:60}
#toast.on{opacity:1}
.empty{text-align:center;padding:60px 16px;color:var(--mu)}
@media(max-width:800px){aside{display:none}main{margin:0;padding:calc(68px + env(safe-area-inset-top)) 12px 40px}.w{grid-template-columns:1fr}.logo span,.hide-m{display:none}.top{gap:8px;padding-left:12px;padding-right:12px}}

/* ── mobile-app look ── */
.btn.p{background:var(--red);color:#fff}
.btn.on{background:var(--tx);color:var(--bg)}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.ib:hover{background:var(--s2)}
.mob,.bn{display:none}
.th{border-radius:20px}
.t{font-size:15px}
.chip{border-radius:999px;height:34px;padding:0 16px}
.stories{display:flex;gap:14px;overflow-x:auto;padding:2px 0 16px;scrollbar-width:none}
.stories a{flex:none;width:68px;text-align:center;font-size:12px;color:var(--mu)}
.stories span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rg{position:relative;width:66px;height:66px;margin:0 auto 4px;border-radius:50%;border:2px solid var(--ln);padding:3px}
.stories a:not(:first-child) .rg{border-color:var(--red)}
.rg .av{width:100%!important;height:100%!important}
.rg .pl{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center}
.rg .pl .ic{width:14px;height:14px}
.flt{display:flex;gap:16px;margin:0 0 20px;flex-wrap:wrap}
.flt label{display:flex;align-items:center;gap:8px;color:var(--mu)}
.flt select{background:var(--s2);border:0;border-radius:10px;padding:8px 10px;font-weight:600}
.acts{display:flex;justify-content:space-around;background:var(--s2);border-radius:20px;padding:12px 8px;margin:12px 0}
.acts>*{display:grid;justify-items:center;gap:4px;color:var(--mu);font-size:12px;min-width:64px}
.acts .on{color:var(--red)}.acts .on .ic{fill:currentColor}
.acts .ic{width:22px;height:22px}
#sb{margin-left:auto;height:44px;padding:0 28px;border-radius:22px;font-weight:600}
@media(max-width:800px){
  form.s{display:none}.mob{display:grid}.top .logo{margin-right:auto}
  body.sq form.s{display:flex;margin:0;max-width:none}
  body.sq .logo,body.sq .mob,body.sq #th,body.sq #acct{display:none}
  .bn{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));height:64px;background:var(--s2);border:1px solid var(--ln);border-radius:30px;z-index:20;align-items:center;justify-content:space-around;padding:0 6px}
  .bn a{display:grid;justify-items:center;gap:2px;font-size:10.5px;color:var(--mu);padding:6px 10px;border-radius:16px}
  .bn a.on{color:var(--tx);background:var(--s3)}
  .bn .mk,.bn .mk.on{width:54px;height:54px;border-radius:50%;background:var(--red);color:#fff;margin-top:-28px;padding:0;place-items:center;box-shadow:0 6px 18px #e32b2b66}
  main{padding-bottom:110px}
  .grid{gap:24px}
  video{border-radius:20px}
}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="#/"><svg viewBox="0 0 32 32"><defs><linearGradient id="vzg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF5A3C"/><stop offset="1" stop-color="#D4145A"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#vzg)"/><path d="M7.5 9.5L16 24l8.5-14.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.6 11.5l5.2 3.3-5.2 3.3z" fill="#fff"/></svg><span>Vuzora</span></a>
  <form class="s" id="sf"><input id="q" type="search" placeholder="Search" aria-label="Search"><button aria-label="Search" data-i="search"></button></form>
  <button class="ib mob" id="sbm" aria-label="Search" data-i="search"></button><a class="btn hide-m" href="#/upload"><span data-i="plus"></span>Upload</a>
  <button class="btn" id="th" aria-label="Switch theme"></button>
  <span id="acct"></span>
</header>
<aside id="side"></aside>
<main id="v"></main>
<nav class="bn" id="bn" aria-label="Main"></nav>
<div id="toast"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,updateProfile}from"https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
import{getDatabase,ref,get,set,update,remove,push,query,orderByChild,limitToLast,equalTo,runTransaction}from"https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
import{getStorage,ref as sr,uploadBytesResumable,getDownloadURL,deleteObject}from"https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

const app=initializeApp({apiKey:"AIzaSyBQSPwpVbGrdCuOoyitAeWQHIeipj2MgIY",authDomain:"newstart-64c43.firebaseapp.com",databaseURL:"https://newstart-64c43-default-rtdb.firebaseio.com",projectId:"newstart-64c43",storageBucket:"newstart-64c43.firebasestorage.app",messagingSenderId:"941619830061",appId:"1:941619830061:web:de9e0f791eb8f6eacf87a4"});
const auth=getAuth(app),db=getDatabase(app),st=getStorage(app);
const N={v:'vz_videos',c:'vz_channels',l:'vz_likes',m:'vz_comments',s:'vz_subs',ms:'vz_mysubs',w:'vz_views'};
const CATS=['Music','Gaming','Learning','Tech','News','Sports','Comedy','Lifestyle','Other'];
const $=s=>document.querySelector(s),V=$('#v');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>/^https:\/\//i.test(u||'')?u:'';
const pl=(n,w)=>`${n} ${w}${n==1?'':'s'}`;
const num=n=>{n=+n||0;return n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,'')+'M':n>=1e3?(n/1e3).toFixed(1).replace(/\.0$/,'')+'K':''+n};
const ago=t=>{if(!t)return'';const s=(Date.now()-t)/1e3;if(s<60)return'just now';for(const[u,k]of[['minute',60],['hour',60],['day',24],['week',7],['month',4.35],['year',12]]){}let m=s/60,l=[['minute',60],['hour',24],['day',7],['week',4.35],['month',12],['year',1e9]],x=m;for(const[u,d]of l){if(x<d)return pl(Math.floor(x),u)+' ago';x/=d}};
const dur=s=>{s=Math.round(+s||0);const h=s/3600|0,m=(s%3600)/60|0,c=s%60;return h?`${h}:${String(m).padStart(2,0)}:${String(c).padStart(2,0)}`:`${m}:${String(c).padStart(2,0)}`};
const linkify=s=>s.replace(/(https?:\/\/[^\s<]+)/g,'<a class="lk" href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
const av=(p,n,z=36)=>safe(p)?`<img class="av" style="width:${z}px;height:${z}px" src="${esc(p)}" alt="" referrerpolicy="no-referrer">`:`<span class="av" style="width:${z}px;height:${z}px;background:hsl(${[...String(n||'?')].reduce((a,c)=>(a*31+c.charCodeAt(0))%360,0)} 50% 42%)">${esc((String(n||'?')[0]||'?').toUpperCase())}</span>`;
const ICONS={search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',plus:'<path d="M12 5v14M5 12h14"/>',moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',like:'<path d="M7 11v9H4v-9zM7 11l4-8c1.6 0 2.6 1.1 2.3 2.7L12.8 9H19a2 2 0 0 1 2 2.4l-1.3 6.6A2 2 0 0 1 17.7 20H7"/>',share:'<path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M12 15V3M7 8l5-5 5 5"/>',close:'<path d="M6 6l12 12M18 6L6 18"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',compass:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-5.5 6.5-5.5s6.5 2 6.5 5.5M16 4.8a3.5 3.5 0 0 1 0 6.4M18.5 14.8c2 .7 3 2.3 3 5.2"/>',library:'<rect x="3" y="6" width="18" height="14" rx="2.5"/><path d="M7 3h10M10.5 10.5l4 2.5-4 2.5z"/>',download:'<path d="M12 3v12M7 10l5 5 5-5M5 20h14"/>'};
const icon=n=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||''}</svg>`;
document.querySelectorAll('[data-i]').forEach(s=>{s.outerHTML=icon(s.dataset.i)});
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)};
const bump=(p,b)=>runTransaction(ref(db,p),c=>Math.max(0,(+c||0)+b));

let me=null,ch=null,T=0,P=null,CAT='All';

/* theme */
const setTheme=t=>{document.documentElement.dataset.theme=t;localStorage.setItem('vz_theme',t);$('#mt').content=t=='dark'?'#111113':'#FFFFFF';$('#th').innerHTML=icon(t=='dark'?'sun':'moon')};
setTheme(localStorage.getItem('vz_theme')||'dark');
$('#th').onclick=()=>setTheme(document.documentElement.dataset.theme=='dark'?'light':'dark');

/* data */
const pool=()=>P||(P=get(query(ref(db,N.v),orderByChild('createdAt'),limitToLast(150))).then(s=>{const a=[];s.forEach(c=>{a.push({id:c.key,...c.val()})});return a.reverse()}).catch(e=>{P=null;throw e}));
const byChannel=uid=>get(query(ref(db,N.v),orderByChild('uid'),equalTo(uid))).then(s=>{const a=[];s.forEach(c=>{a.push({id:c.key,...c.val()})});return a.sort((x,y)=>y.createdAt-x.createdAt)});
async function ensureChannel(u){
  const r=ref(db,`${N.c}/${u.uid}`),s=await get(r);
  if(s.exists())return ch={uid:u.uid,...s.val()};
  const name=u.displayName||(u.email||'Creator').split('@')[0];
  const rec={name,handle:name.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,18)+Math.floor(100+Math.random()*900),photo:u.photoURL||'',banner:'',about:'',subs:0,videoCount:0,createdAt:Date.now()};
  await set(r,rec);return ch={uid:u.uid,...rec};
}

/* cards */
const card=(v,del)=>{
  const d=document.createElement('article');
  d.innerHTML=`<a class="th" data-src="${esc(safe(v.videoUrl))}" href="#/watch/${esc(v.id)}"><img loading="lazy" alt="" src="${esc(safe(v.thumbUrl))}"><span class="d">${dur(v.duration)}</span></a>
  <div class="m"><a href="#/channel/${esc(v.uid)}">${av(v.channelPhoto,v.channelName)}</a><div><a class="t" href="#/watch/${esc(v.id)}">${esc(v.title)}</a><a class="mu" href="#/channel/${esc(v.uid)}">${esc(v.channelName)}</a><div class="mu">${num(v.views)} views · ${ago(v.createdAt)}</div></div>${del?`<button class="btn" title="Delete video">${icon('trash')}Delete</button>`:''}</div>`;
  if(del)d.querySelector('button').onclick=async()=>{
    if(!confirm(`Delete "${v.title}"?`))return;
    try{await remove(ref(db,`${N.m}/${v.id}`)).catch(()=>{});await remove(ref(db,`${N.l}/${v.id}`)).catch(()=>{});await remove(ref(db,`${N.v}/${v.id}`));
      if(v.videoPath)deleteObject(sr(st,v.videoPath)).catch(()=>{});if(v.thumbPath)deleteObject(sr(st,v.thumbPath)).catch(()=>{});
      bump(`${N.c}/${v.uid}/videoCount`,-1).catch(()=>{});P=null;d.remove();toast('Video deleted')}catch(e){toast(e.message)}};
  const th=d.querySelector('.th');io.observe(th);
  th.addEventListener('mouseenter',()=>{if(!touch.matches)preview(th)});
  th.addEventListener('mouseleave',()=>{if(!touch.matches&&activeTh===th)stopPrev()});
  th.addEventListener('focus',()=>{if(!touch.matches)preview(th)});
  th.addEventListener('blur',()=>{if(activeTh===th)stopPrev()});
  return d;
};
const fill=(box,items,empty,del)=>{box.innerHTML='';if(!items.length)box.innerHTML=`<div class="empty">${empty}</div>`;else items.forEach(v=>box.appendChild(card(v,del)))};

/* auth modal */
function signIn(msg){
  const o=document.createElement('div');o.className='ov';
  o.innerHTML=`<form class="sh f"><h2>Sign in</h2><p class="mu">${esc(msg||'Sign in to like, comment, subscribe and upload.')}</p>
  <label hidden>Your name<input name="nm" maxlength="40"></label><label>Email<input name="em" type="email" autocomplete="email"></label><label>Password<input name="pw" type="password" autocomplete="current-password"></label>
  <p class="er" style="color:var(--hot);min-height:18px;margin:0 0 8px"></p><button class="btn p" style="width:100%;height:44px">Sign in</button>
  <p style="margin:14px 0 0"><button type="button" class="lk">New here? Create an account</button></p></form>`;
  document.body.appendChild(o);
  const f=o.firstChild,q=s=>f.querySelector(s);let up=false;
  o.onmousedown=e=>{if(e.target===o)o.remove()};
  q('.lk').onclick=()=>{up=!up;q('label').hidden=!up;q('h2').textContent=up?'Create your account':'Sign in';q('.btn').textContent=up?'Create account':'Sign in';q('.lk').textContent=up?'Have an account? Sign in':'New here? Create an account'};
  f.onsubmit=async e=>{
    e.preventDefault();const em=f.em.value.trim(),pw=f.pw.value,nm=f.nm.value.trim(),er=q('.er');er.textContent='';
    if(!em||!pw)return er.textContent='Enter your email and password.';
    if(up&&!nm)return er.textContent='Add the name people will see.';
    q('.btn').disabled=true;
    try{if(up){const c=await createUserWithEmailAndPassword(auth,em,pw);await updateProfile(c.user,{displayName:nm})}else await signInWithEmailAndPassword(auth,em,pw);o.remove();toast('Signed in')}
    catch(x){const c=x.code||'';er.textContent=/invalid-credential|user-not-found|wrong-password/.test(c)?'Wrong email or password.':/email-already/.test(c)?'That email already has an account.':/weak/.test(c)?'Use at least 6 characters.':x.message;q('.btn').disabled=false}
  };
  setTimeout(()=>f.em.focus(),50);
}
const need=m=>{if(me)return true;signIn(m);return false};

/* chrome */
function chrome(){
  $('#acct').innerHTML=me?`<a href="#/channel/${me.uid}" aria-label="Your channel">${av(ch&&ch.photo,(ch&&ch.name)||me.displayName||me.email,34)}</a>`:'<button class="btn p" id="si">Sign in</button>';
  if(!me)$('#si').onclick=()=>signIn();
  $('#side').innerHTML=`<a href="#/" data-r="home">Home</a><a href="#/explore">Explore</a><a href="#/channels">Channels</a><a href="#/upload" data-r="upload">Upload</a>${me?`<a href="#/channel/${me.uid}" data-r="mine">Your channel</a><button id="so">Sign out</button>`:''}`;
  if(me)$('#so').onclick=async()=>{await signOut(auth);toast('Signed out')};
  const h=location.hash||'#/';
  $('#bn').innerHTML=`<a href="#/">${icon('home')}<span>Home</span></a><a href="#/explore">${icon('compass')}<span>Explore</span></a><a class="mk" href="#/upload" aria-label="Upload">${icon('plus')}</a><a href="#/channels">${icon('users')}<span>Channels</span></a><a href="${me?'#/channel/'+me.uid:'#/library'}">${icon('library')}<span>Library</span></a>`;
  document.querySelectorAll('#side a,#bn a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')===h));
}

/* pages */
async function home(tk){
  V.innerHTML=`<div class="stories" id="st"></div><div class="chips">${['All',...CATS].map(c=>`<button class="chip${c==CAT?' on':''}" data-c="${c}">${c}</button>`).join('')}</div><div class="grid" id="g"></div>`;
  let items;try{items=await pool()}catch(e){V.innerHTML=`<div class="empty">Couldn't load videos.<br>${esc(e.message)}</div>`;return}
  if(tk!==T)return;
  const seen=new Map();items.forEach(v=>{if(!seen.has(v.uid))seen.set(v.uid,v)});
  $('#st').innerHTML=`<a href="#/upload"><div class="rg">${av(me&&ch&&ch.photo,(ch&&ch.name)||'You',56)}<b class="pl">${icon('plus')}</b></div><span>Your video</span></a>`+[...seen.values()].slice(0,14).map(v=>ring(v.uid,v.channelPhoto,v.channelName)).join('');
  const draw=()=>fill($('#g'),items.filter(v=>CAT=='All'||v.category==CAT),'No videos here yet. <a class="lk" href="#/upload">Upload one</a>');
  draw();
  V.querySelector('.chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;CAT=b.dataset.c;V.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x==b));draw()};
}
async function search(q,tk){
  $('#q').value=q;V.innerHTML=`<h2>Results for “${esc(q)}”</h2><div class="grid" id="g"></div>`;
  try{
    const w=q.toLowerCase().split(/\s+/).filter(Boolean),items=await pool();if(tk!==T)return;
    const hits=items.filter(v=>{const h=`${v.title} ${v.channelName} ${v.category||''} ${v.desc||''}`.toLowerCase();return w.every(x=>h.includes(x))});
    fill($('#g'),hits,`No matches for “${esc(q)}”.`);
  }catch(e){$('#g').innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}
async function channel(uid,tk){
  V.innerHTML='<div class="empty">Loading…</div>';
  const s=await get(ref(db,`${N.c}/${uid}`)).catch(()=>null);if(tk!==T)return;
  if(!s||!s.exists()){V.innerHTML='<div class="empty">Channel not found.</div>';return}
  const c=s.val(),own=me&&me.uid==uid;
  let subbed=me&&!own?(await get(ref(db,`${N.ms}/${me.uid}/${uid}`))).exists():false,subs=c.subs||0;
  V.innerHTML=`<div class="row" style="gap:18px">${av(c.photo,c.name,80)}<div style="flex:1;min-width:180px"><h2 style="margin:0">${esc(c.name)}</h2><div class="mu">@${esc(c.handle)} · <span id="sc">${pl(subs,'subscriber')}</span></div><div class="mu">${esc(c.about||'')}</div></div>${own?'':'<button class="btn" id="sb"></button>'}</div><div class="grid" id="g"></div>`;
  const paint=()=>{const b=$('#sb');if(b){b.textContent=subbed?'Subscribed':'Subscribe';b.className='btn'+(subbed?'':' p')}$('#sc').textContent=pl(subs,'subscriber')};
  paint();if($('#sb'))$('#sb').onclick=()=>toggleSub(uid,()=>subbed,x=>{subbed=x;subs=Math.max(0,subs+(x?1:-1));paint()});
  try{const items=await byChannel(uid);if(tk!==T)return;fill($('#g'),items,own?'You haven\'t uploaded anything yet.':'No videos yet.',own)}catch(e){$('#g').innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}
async function toggleSub(uid,get_,set_){
  if(!need('Sign in to subscribe.')||uid==me.uid)return;
  const was=get_();set_(!was);
  try{await update(ref(db),{[`${N.s}/${uid}/${me.uid}`]:was?null:true,[`${N.ms}/${me.uid}/${uid}`]:was?null:true});await bump(`${N.c}/${uid}/subs`,was?-1:1);toast(was?'Unsubscribed':'Subscribed')}
  catch(e){set_(was);toast(e.message)}
}
async function watch(id,tk){
  V.innerHTML='<div class="empty">Loading…</div>';
  let s;try{s=await get(ref(db,`${N.v}/${id}`))}catch(e){V.innerHTML=`<div class="empty">${esc(e.message)}</div>`;return}
  if(tk!==T)return;
  if(!s.exists()){V.innerHTML='<div class="empty">This video isn\'t available.<br><a class="lk" href="#/">Back to Home</a></div>';return}
  const v={id,...s.val()};document.title=`${v.title} – Vuzora`;
  const [cs,rel]=await Promise.all([get(ref(db,`${N.c}/${v.uid}`)).catch(()=>null),pool().catch(()=>[])]);
  let liked=false,subbed=false,subs=cs&&cs.exists()?cs.val().subs||0:0,likes=v.likes||0,cc=v.commentsCount||0;
  if(me){liked=(await get(ref(db,`${N.l}/${id}/${me.uid}`)).catch(()=>null))?.exists()||false;if(me.uid!=v.uid)subbed=(await get(ref(db,`${N.ms}/${me.uid}/${v.uid}`)).catch(()=>null))?.exists()||false}
  if(tk!==T)return;
  const own=me&&me.uid==v.uid;
  V.innerHTML=`<div class="w"><div><video id="vp" controls playsinline autoplay poster="${esc(safe(v.thumbUrl))}" src="${esc(safe(v.videoUrl))}"></video>
  <h1 style="font-size:20px;margin:12px 0 0">${esc(v.title)}</h1>
  <div class="row"><a href="#/channel/${esc(v.uid)}" style="display:flex;gap:12px;align-items:center">${av(cs&&cs.exists()?cs.val().photo:v.channelPhoto,v.channelName,40)}<div><b>${esc(v.channelName)}</b><div class="mu" id="sc"></div></div></a>${own?'':'<button class="btn" id="sb"></button>'}
  </div><div class="acts"><button id="lb"></button><button id="shb">${icon('share')}<span>Share</span></button><a id="dl" href="${esc(safe(v.videoUrl))}" target="_blank" rel="noopener" download>${icon('download')}<span>Download</span></a></div>
  <div class="box"><b>${pl(v.views||0,'view')} · ${esc(ago(v.createdAt))}${v.category?' · '+esc(v.category):''}</b>\n${linkify(esc(v.desc||'No description.'))}</div>
  <h3 id="cn" style="margin-top:24px"></h3><div id="cb"></div><div id="cl"></div></div>
  <aside style="position:static;width:auto;padding:0" id="rl"><h3 style="margin:0 0 12px">Maybe you like that</h3></aside></div>`;
  const vp=$('#vp'),paint=()=>{$('#lb').innerHTML=`${icon('like')}<span>${num(likes)}</span>`;$('#lb').classList.toggle('on',liked);$('#sc').textContent=pl(subs,'subscriber');const b=$('#sb');if(b){b.textContent=subbed?'Subscribed':'Subscribe';b.className='btn'+(subbed?'':' p')}$('#cn').textContent=pl(cc,'comment')};
  paint();
  let counted=false;vp.addEventListener('timeupdate',()=>{if(!counted&&vp.currentTime>=5){counted=true;countView(id)}});
  $('#lb').onclick=async()=>{if(!need('Sign in to like videos.'))return;const was=liked;liked=!was;likes=Math.max(0,likes+(was?-1:1));paint();
    try{was?await remove(ref(db,`${N.l}/${id}/${me.uid}`)):await set(ref(db,`${N.l}/${id}/${me.uid}`),true);await bump(`${N.v}/${id}/likes`,was?-1:1)}catch(e){liked=was;likes=Math.max(0,likes+(was?1:-1));paint();toast(e.message)}};
  if($('#sb'))$('#sb').onclick=()=>toggleSub(v.uid,()=>subbed,x=>{subbed=x;subs=Math.max(0,subs+(x?1:-1));paint()});
  $('#shb').onclick=async()=>{const u=location.href;try{navigator.share?await navigator.share({title:v.title,url:u}):(await navigator.clipboard.writeText(u),toast('Link copied'))}catch(_){}};
  const r=$('#rl');rel.filter(x=>x.id!=id).slice(0,12).forEach(x=>{const d=document.createElement('div');d.className='rel';d.innerHTML=`<a class="th" href="#/watch/${esc(x.id)}"><img loading="lazy" alt="" src="${esc(safe(x.thumbUrl))}"><span class="d">${dur(x.duration)}</span></a><div><a class="t" style="font-size:14px" href="#/watch/${esc(x.id)}">${esc(x.title)}</a><div class="mu">${esc(x.channelName)}</div><div class="mu">${num(x.views)} views</div></div>`;r.appendChild(d)});
  /* comments */
  const cm=(k,c)=>{const n=document.createElement('div');n.className='cm';const can=me&&(me.uid==c.uid||me.uid==v.uid);
    n.innerHTML=`${av(c.photo,c.name,40)}<div><b>${esc(c.name)}</b> <span class="mu">${esc(ago(c.ts))}</span><br>${linkify(esc(c.text))}</div>${can?`<button class="mu" aria-label="Delete comment">${icon('close')}</button>`:''}`;
    if(can)n.querySelector('button').onclick=async()=>{if(!confirm('Delete this comment?'))return;try{await remove(ref(db,`${N.m}/${id}/${k}`));n.remove();cc=Math.max(0,cc-1);paint();bump(`${N.v}/${id}/commentsCount`,-1).catch(()=>{})}catch(e){toast(e.message)}};
    return n};
  const cb=$('#cb');
  if(!me)cb.innerHTML='<button class="btn" id="cs">Sign in to comment</button>',$('#cs').onclick=()=>signIn('Sign in to join the conversation.');
  else{cb.innerHTML=`<textarea id="ct" maxlength="1000" placeholder="Add a comment"></textarea><div style="text-align:right;margin-top:8px"><button class="btn p" id="cp">Comment</button></div>`;
    $('#cp').onclick=async()=>{const text=$('#ct').value.trim();if(!text)return;const rec={uid:me.uid,name:(ch&&ch.name)||me.displayName||'User',photo:(ch&&ch.photo)||'',text,ts:Date.now()};
      try{const k=push(ref(db,`${N.m}/${id}`));await set(k,rec);$('#ct').value='';cc++;paint();$('#cl').prepend(cm(k.key,rec));bump(`${N.v}/${id}/commentsCount`,1).catch(()=>{})}catch(e){toast(e.message)}}}
  get(query(ref(db,`${N.m}/${id}`),orderByChild('ts'),limitToLast(50))).then(sn=>{if(tk!==T)return;const a=[];sn.forEach(c=>{a.push([c.key,c.val()])});a.reverse().forEach(([k,c])=>$('#cl').appendChild(cm(k,c)))}).catch(()=>{$('#cl').innerHTML='<p class="mu">Comments couldn\'t load.</p>'});
}

/* upload */
const once=(e,n)=>new Promise((res,rej)=>{const t=setTimeout(()=>rej(new Error('Could not read this video.')),8000);e.addEventListener(n,()=>{clearTimeout(t);res()},{once:true})});
async function frame(f){
  const u=URL.createObjectURL(f),v=document.createElement('video');v.muted=true;v.playsInline=true;v.src=u;
  await once(v,'loadedmetadata');const d=v.duration||0;v.currentTime=Math.min(1,d/2);await once(v,'seeked');
  const c=document.createElement('canvas');c.width=640;c.height=360;const x=c.getContext('2d');x.fillRect(0,0,640,360);
  const k=Math.min(640/v.videoWidth,360/v.videoHeight),w=v.videoWidth*k,h=v.videoHeight*k;x.drawImage(v,(640-w)/2,(360-h)/2,w,h);URL.revokeObjectURL(u);
  return{duration:Math.round(d),blob:await new Promise(r=>c.toBlob(r,'image/jpeg',.8))};
}
const put=(path,blob,cb)=>new Promise((res,rej)=>{const t=uploadBytesResumable(sr(st,path),blob,{contentType:blob.type||'application/octet-stream',cacheControl:'public,max-age=31536000'});t.on('state_changed',s=>cb&&cb(s.bytesTransferred/s.totalBytes*100),rej,async()=>{try{res(await getDownloadURL(t.snapshot.ref))}catch(e){rej(e)}})});
function upload(){
  if(!me){V.innerHTML='<div class="empty"><b>Upload a video</b><br>Sign in to share your videos.<br><br><button class="btn p" id="si2">Sign in</button></div>';$('#si2').onclick=()=>signIn('Sign in to upload.');return}
  V.innerHTML=`<div class="f" style="max-width:640px;margin:0 auto"><h2>Upload a video</h2><p class="mu">MP4 or WebM, up to 600 MB.</p>
  <label>Video<input id="uf" type="file" accept="video/*"></label><label>Title<input id="ut" maxlength="100"></label><label>Description<textarea id="ud" maxlength="2000"></textarea></label>
  <label>Category<select id="uc">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></label>
  <div class="bar"><i id="pb"></i></div><p class="mu" id="pt"></p><button class="btn p" id="up">Publish</button></div>`;
  $('#uf').onchange=e=>{const f=e.target.files[0];if(f&&!$('#ut').value)$('#ut').value=f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').slice(0,100)};
  $('#up').onclick=async()=>{
    const f=$('#uf').files[0],title=$('#ut').value.trim();
    if(!f||!/^video\//.test(f.type))return toast('Choose a video file.');
    if(!title)return toast('Add a title.');
    if(f.size>6e8)return toast('That file is over 600 MB.');
    $('#up').disabled=true;const setP=(p,t)=>{$('#pb').style.width=p+'%';$('#pt').textContent=t};
    const vid=push(ref(db,N.v)).key,uid=me.uid,tp=`vuzora/thumbs/${uid}/${vid}.jpg`,vp=`vuzora/videos/${uid}/${vid}_${f.name.replace(/[^a-zA-Z0-9.\-_]/g,'_').slice(-60)}`;
    try{
      setP(2,'Preparing…');const{blob,duration}=await frame(f);
      const thumbUrl=await put(tp,blob);
      const videoUrl=await put(vp,f,p=>setP(Math.max(4,p*.96),`Uploading… ${Math.round(p)}%`));
      setP(98,'Publishing…');
      await set(ref(db,`${N.v}/${vid}`),{uid,title,desc:$('#ud').value.trim(),category:$('#uc').value,tags:[],videoUrl,thumbUrl,videoPath:vp,thumbPath:tp,duration,views:0,likes:0,commentsCount:0,createdAt:Date.now(),channelName:(ch&&ch.name)||me.displayName||'Creator',channelPhoto:(ch&&ch.photo)||''});
      bump(`${N.c}/${uid}/videoCount`,1).catch(()=>{});P=null;toast('Published');location.hash=`#/watch/${vid}`;
    }catch(e){deleteObject(sr(st,tp)).catch(()=>{});deleteObject(sr(st,vp)).catch(()=>{});$('#up').disabled=false;setP(0,'');toast(/unauthorized|permission/i.test(e.code||e.message||'')?'Firebase blocked the upload. Check your Storage rules.':e.message)}
  };
}

/* one view per signed-in account per video */
async function countView(id){
  if(!me)return;
  try{const r=ref(db,`${N.w}/${id}/${me.uid}`);if((await get(r)).exists())return;await set(r,Date.now());await bump(`${N.v}/${id}/views`,1)}catch(_){}
}

/* card previews: hover/focus on desktop, centred card on touch */
const touch=matchMedia('(hover:none)');let activeTh=null;const vis=new Set();let pt;
function stopPrev(){if(!activeTh)return;const v=activeTh.querySelector('.pvv');if(v){v.pause();v.removeAttribute('src');v.load();v.remove()}activeTh=null}
function preview(th){
  if(th===activeTh||!th.dataset.src)return;stopPrev();
  const v=document.createElement('video');v.className='pvv';v.muted=true;v.loop=true;v.playsInline=true;v.setAttribute('playsinline','');v.src=th.dataset.src;
  th.insertBefore(v,th.querySelector('.d'));activeTh=th;v.play().catch(()=>{});
}
function pickTouch(){
  if(!touch.matches)return;let best=null,bd=1e9;
  vis.forEach(t=>{if(!t.isConnected){vis.delete(t);return}const r=t.getBoundingClientRect(),d=Math.abs(r.top+r.height/2-innerHeight/2);if(d<bd){bd=d;best=t}});
  best?preview(best):stopPrev();
}
const io=new IntersectionObserver(es=>{es.forEach(e=>e.isIntersecting?vis.add(e.target):vis.delete(e.target));clearTimeout(pt);pt=setTimeout(pickTouch,350)},{threshold:.6});
addEventListener('scroll',()=>{clearTimeout(pt);pt=setTimeout(pickTouch,350)},{passive:true});

const ring=(uid,photo,name)=>`<a href="#/channel/${esc(uid)}"><div class="rg">${av(photo,name,56)}</div><span>${esc(name)}</span></a>`;
const signPage=(t,m)=>{V.innerHTML=`<div class="empty"><b>${t}</b><br>${m}<br><br><button class="btn p" id="sip">Sign in</button></div>`;$('#sip').onclick=()=>signIn()};
async function explore(tk){
  let cat='All';
  V.innerHTML=`<h2>Explore</h2><div class="chips" id="et">${['All',...CATS].map(c=>`<button class="chip${c==cat?' on':''}" data-c="${c}">${c}</button>`).join('')}</div>
  <div class="flt"><label>Date <select id="ed"><option value="0">Any time</option><option value="864e5">Today</option><option value="6048e5">This week</option><option value="2592e6">This month</option></select></label><label>Sort by <select id="es"><option value="v">Most views</option><option value="n">Newest</option></select></label></div><div class="grid" id="g"></div>`;
  let items;try{items=await pool()}catch(e){$('#g').innerHTML=`<div class="empty">${esc(e.message)}</div>`;return}
  if(tk!==T)return;
  const draw=()=>{const r=+$('#ed').value,s=$('#es').value;let a=items.filter(v=>(cat=='All'||v.category==cat)&&(!r||Date.now()-v.createdAt<r));a=s=='v'?[...a].sort((x,y)=>(y.views||0)-(x.views||0)):a;fill($('#g'),a,'Nothing here yet.')};
  draw();$('#ed').onchange=$('#es').onchange=draw;
  $('#et').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;cat=b.dataset.c;V.querySelectorAll('#et .chip').forEach(x=>x.classList.toggle('on',x==b));draw()};
}
async function channels(tk){
  if(!me)return signPage('Channels','Sign in to see channels you follow.');
  V.innerHTML='<h2>Channels</h2><div class="stories" id="st"></div><div class="grid" id="g"></div>';
  try{
    const s=await get(ref(db,`${N.ms}/${me.uid}`)),ids=s.exists()?Object.keys(s.val()).slice(0,20):[];
    if(!ids.length){$('#g').innerHTML='<div class="empty">No subscriptions yet. Subscribe to channels and their newest videos show up here.</div>';return}
    const[cs,ls]=await Promise.all([Promise.all(ids.map(i=>get(ref(db,`${N.c}/${i}`)).catch(()=>null))),Promise.all(ids.map(i=>byChannel(i).catch(()=>[])))]);
    if(tk!==T)return;
    $('#st').innerHTML=cs.filter(c=>c&&c.exists()).map(c=>ring(c.key,c.val().photo,c.val().name)).join('');
    fill($('#g'),ls.flat().sort((a,b)=>b.createdAt-a.createdAt).slice(0,60),'Nothing new yet.');
  }catch(e){$('#g').innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}
$('#sbm').onclick=()=>{document.body.classList.toggle('sq');if(document.body.classList.contains('sq'))$('#q').focus()};

/* router */
function route(){
  stopPrev();vis.clear();const p=document.querySelector('video');if(p)p.pause();
  const h=location.hash||'#/',tk=++T;let m;document.title='Vuzora';window.scrollTo(0,0);chrome();
  if(m=h.match(/^#\/watch\/([^/?]+)/))return watch(decodeURIComponent(m[1]),tk);
  if(m=h.match(/^#\/results\/(.*)$/))return search(decodeURIComponent(m[1]),tk);
  if(m=h.match(/^#\/channel\/([^/?]+)/))return channel(decodeURIComponent(m[1]),tk);
  if(h=='#/explore')return explore(tk);
  if(h=='#/channels')return channels(tk);
  if(h=='#/library'){if(me){location.hash='#/channel/'+me.uid;return}return signPage('Library','Sign in to see your channel and uploads.')}
  if(h=='#/upload')return upload();
  return home(tk);
}
addEventListener('hashchange',route);
$('#sf').onsubmit=e=>{e.preventDefault();const q=$('#q').value.trim();if(q){location.hash=`#/results/${encodeURIComponent(q)}`;$('#q').blur();document.body.classList.remove('sq')}};
onAuthStateChanged(auth,async u=>{me=u;ch=null;if(u){try{await ensureChannel(u)}catch(_){}}route()});
route();
</script>
