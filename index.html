<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Vuzora</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500&display=swap" rel="stylesheet">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" id="mt">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2032%2032%22%3E%3Crect%20width=%2232%22%20height=%2232%22%20rx=%229%22%20fill=%22%237C3AED%22/%3E%3Cpath%20fill=%22%23fff%22%20transform=%22translate(7%207.9)%20scale(.0278)%20translate(-97%20-82)%22%20d=%22M320%2082%20622%20236V352L320%20203ZM214%20278%20320%20205V505L622%20352%20745%20408%20225%20664%2097%20614%20214%20560Z%22/%3E%3C/svg%3E">
<style>
:root{--bg:#0F0F0F;--s2:#272727;--s3:#3F3F3F;--ln:#303030;--tx:#F1F1F1;--mu:#AAA;--link:#3EA6FF;--hot:#FF4E45;color-scheme:dark}
[data-theme=light]{--bg:#FFF;--s2:#F2F2F2;--s3:#E5E5E5;--ln:#E5E5E5;--tx:#0F0F0F;--mu:#606060;--link:#065FD4;--hot:#C00;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h2{margin:0 0 12px}
.top{position:fixed;inset:0 0 auto;height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;display:flex;align-items:center;gap:12px;background:var(--bg);z-index:10}
.logo{display:flex;align-items:center;gap:6px;font-weight:700;font-size:20px;letter-spacing:-.04em}
.logo{gap:9px;color:var(--tx)}.logo .lm{height:28px;width:auto}.logo .ln{font-family:"Lexend","Poppins","Segoe UI",system-ui,sans-serif;font-size:21px;font-weight:500;letter-spacing:-.02em;line-height:1;color:var(--tx);text-transform:lowercase}.logo .lt{height:11.5px;width:auto;fill:currentColor}
.ic{width:20px;height:20px;flex:none;display:block}
.btn .ic{width:18px;height:18px}
form.s{flex:1;max-width:600px;margin:0 auto;display:flex}
.s input{flex:1;min-width:0;height:40px;padding:0 16px;border:1px solid var(--ln);border-radius:20px 0 0 20px;background:var(--bg);outline:0}
.s button{width:56px;height:40px;border:1px solid var(--ln);border-left:0;border-radius:0 20px 20px 0;background:var(--s2)}
.btn{height:36px;padding:0 16px;border-radius:18px;background:var(--s2);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--s3)}
.btn.p,.btn.on{background:var(--tx);color:var(--bg)}
.btn[disabled]{opacity:.5;pointer-events:none}
.lk{color:var(--link);font-weight:500}
aside{position:fixed;top:56px;bottom:0;left:0;width:200px;padding:12px;background:var(--bg)}
aside a,aside button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px}
aside a:hover,aside a.on,aside button:hover{background:var(--s2)}
main{margin-left:200px;padding:calc(72px + env(safe-area-inset-top)) 24px 40px}
.chips{display:flex;gap:12px;overflow-x:auto;margin-bottom:20px;scrollbar-width:none}
.chip{flex:none;height:34px;padding:0 16px;border-radius:999px;background:var(--s2);font-weight:500;white-space:nowrap}
.chip.on{background:var(--tx);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:40px 16px}
.th{display:block;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--s2);position:relative}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.pvv{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;border-radius:0;object-fit:cover;pointer-events:none}
.d{position:absolute;z-index:1;right:6px;bottom:6px;background:#000c;color:#fff;font-size:12px;padding:1px 5px;border-radius:4px}
.m{display:flex;gap:12px;margin-top:12px}
.m>div{min-width:0;flex:1}
.av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;object-fit:cover}
.t{font-weight:600;font-size:16px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mu{color:var(--mu);font-size:13px}
.w{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
video{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;display:block}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0}
.row .r{margin-left:auto;display:flex;gap:8px}
.box{background:var(--s2);border-radius:12px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.rel{display:flex;gap:8px;margin-bottom:12px}
.rel .th{width:168px;flex:none;border-radius:8px}
.cm{display:flex;gap:12px;margin:16px 0}
.cm>div{flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
textarea,.f input,.f select{width:100%;border:1px solid var(--ln);background:var(--bg);border-radius:10px;padding:10px;outline:0}
textarea{min-height:60px;resize:vertical}
.f label{display:grid;gap:6px;margin-bottom:14px;font-weight:600}
.bar{height:6px;background:var(--s2);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#7C3AED}
.ov{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:16px;z-index:50}
.sh{width:min(400px,100%);background:var(--bg);border:1px solid var(--ln);border-radius:16px;padding:22px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:60}
#toast.on{opacity:1}
.empty{text-align:center;padding:60px 16px;color:var(--mu)}
@media(max-width:800px){aside{display:none}main{margin:0;padding:calc(68px + env(safe-area-inset-top)) 12px 40px}.w{grid-template-columns:1fr}.logo .lt,.hide-m{display:none}.top{gap:8px;padding-left:12px;padding-right:12px}}

/* ── mobile bottom nav ── */
.bn{display:none}
@media(max-width:800px){
  .bn{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;align-items:center;justify-content:space-around;background:var(--bg);border-top:1px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bn a,.bn button{display:grid;justify-items:center;gap:2px;min-width:64px;padding:4px 0;font-size:10.5px;color:var(--mu)}
  .bn a.on{color:var(--tx);font-weight:600}
  .bn .mk,.bn .mk.on{width:48px;height:34px;min-width:0;border-radius:12px;background:#7C3AED;color:#fff;place-items:center;padding:0}
  main{padding-bottom:84px}
  #toast{bottom:84px}
}

.st{max-width:560px;margin:0 auto}
.st section{background:var(--s2);border-radius:16px;padding:16px;margin-bottom:14px}
.st h3{margin:0 0 10px;font-size:15px}
.seg{display:flex;gap:8px}
.seg button{flex:1;height:40px;border-radius:10px;background:var(--bg);font-weight:600}
.seg .on{background:var(--tx);color:var(--bg)}
.tg{display:flex;justify-content:space-between;align-items:center}
.tg input{width:22px;height:22px;accent-color:#7C3AED}
@media(max-width:800px){.bn a,.bn button{min-width:56px}}

/* custom alerts + dialogs */
#alerts{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);width:min(420px,calc(100% - 24px));display:grid;gap:8px;z-index:80;pointer-events:none}
.al{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--ln);border-left:4px solid #1a9c5a;border-radius:12px;padding:10px 8px 10px 12px;box-shadow:0 10px 30px #0004;animation:ain .2s}
.al.error{border-left-color:#C00}.al.info{border-left-color:#065FD4}
.al>.ic{width:20px;height:20px;color:#1a9c5a}.al.error>.ic{color:#C00}.al.info>.ic{color:#065FD4}
.al span{flex:1;overflow-wrap:anywhere}
.al button{width:28px;height:28px;display:grid;place-items:center;color:var(--mu)}
.al button .ic{width:16px;height:16px}
.al.out{opacity:0;transform:translateY(-8px);transition:.2s}
@keyframes ain{from{opacity:0;transform:translateY(-8px)}}
.btn.dg{background:#C00;color:#fff}

/* no long-press highlight / callout on UI, media and avatars */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img,svg,video,.av,.th,.d,.bn,aside,.chip,.btn{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none;user-drag:none;pointer-events:none}
.th,.th *{-webkit-touch-callout:none}
.s:not(.o){flex:none;margin:0 0 0 auto}
.s:not(.o) input{display:none}
.s:not(.o) button{width:40px;border:0;border-radius:50%;background:transparent}
.s:not(.o) button:hover{background:var(--s2)}
.s.o input{animation:sx .2s ease-out}
@keyframes sx{from{opacity:0;transform:scaleX(.6);transform-origin:right}}
.top.so .logo{display:none}
/* custom video player */
.pl{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;color:#fff;touch-action:manipulation;outline:0}
.pl .plv{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;border-radius:0;object-fit:contain;background:#000}
.pl:fullscreen{border-radius:0;aspect-ratio:auto;height:100%}
.pl:-webkit-full-screen{border-radius:0;aspect-ratio:auto;height:100%}
.pl-sp{position:absolute;inset:0}
.pl.idle{cursor:none}
.pl button{color:#fff}
.pl-big{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .2s}
.pl-big .ic{width:30px;height:30px}
.pl.paused .pl-big{opacity:1;pointer-events:auto}
@media(hover:none){.pl:not(.idle) .pl-big{opacity:1;pointer-events:auto}}
.pl.busy .pl-big,.pl.scrub .pl-big{opacity:0;pointer-events:none}
.pl-ld{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:plspin .8s linear infinite;opacity:0;pointer-events:none}
.pl.busy .pl-ld{opacity:1}
@keyframes plspin{to{transform:rotate(360deg)}}
.pl-sk{position:absolute;top:50%;margin-top:-24px;padding:12px 18px;border-radius:28px;background:rgba(0,0,0,.55);font-weight:600;opacity:0;pointer-events:none;transition:opacity .15s}
.pl-sk.l{left:10%}.pl-sk.r{right:10%}.pl-sk.on{opacity:1}
.pl-c{position:absolute;left:0;right:0;bottom:0;padding:28px 10px 4px;background:linear-gradient(transparent,rgba(0,0,0,.75));transition:opacity .2s}
.pl.idle .pl-c{opacity:0;pointer-events:none}
.pl-bar{position:relative;height:22px;display:flex;align-items:center;cursor:pointer;touch-action:none;outline:0;margin:0 2px}
.pl-t{position:relative;width:100%;height:3px;background:rgba(255,255,255,.28);border-radius:3px;transition:height .12s}
.pl-bar:hover .pl-t,.pl.scrub .pl-t,.pl-bar:focus-visible .pl-t{height:5px}
.pl-t i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px}
.pl-b{background:rgba(255,255,255,.4)}.pl-p{background:#7C3AED}
.pl-k{position:absolute;top:50%;left:0;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:#7C3AED;transform:scale(0);transition:transform .12s}
.pl-bar:hover .pl-k,.pl.scrub .pl-k,.pl-bar:focus-visible .pl-k{transform:scale(1)}
.pl-tip{position:absolute;bottom:22px;transform:translateX(-50%);padding:3px 7px;border-radius:6px;background:rgba(0,0,0,.8);font-size:12px;opacity:0;pointer-events:none;white-space:nowrap}
.pl-bar:hover .pl-tip,.pl.scrub .pl-tip{opacity:1}
.pl-r{display:flex;align-items:center;gap:2px;height:40px}
.pl-r button{width:38px;height:38px;display:grid;place-items:center;border-radius:50%}
.pl-r button:hover{background:rgba(255,255,255,.15)}
.pl-r .ic{width:22px;height:22px}
.pl-tm{font-size:13px;margin:0 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pl-fl{flex:1}
.pl-r .pl-sd{width:auto;padding:0 10px;border-radius:19px;font-size:13px;font-weight:600}
.pl-vol{display:flex;align-items:center}
.pl-vr{width:0;opacity:0;height:4px;margin:0;accent-color:#fff;transition:width .2s,opacity .2s}
.pl-vol:hover .pl-vr,.pl-vr:focus{width:64px;opacity:1;margin:0 6px}
@media(hover:none){.pl-vr{display:none}}
.pl-mini{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.25);opacity:0;pointer-events:none;transition:opacity .2s}
.pl-mini i{display:block;height:100%;width:0;background:#7C3AED}
.pl.idle .pl-mini{opacity:1}
.pl-m{position:absolute;right:10px;bottom:58px;min-width:140px;max-height:70%;overflow:auto;padding:6px;border-radius:12px;background:rgba(18,18,18,.96)}
.pl-m[hidden]{display:none}
.pl-m button{display:flex;width:100%;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:8px;font-size:13px;text-align:left}
.pl-m button:hover{background:rgba(255,255,255,.12)}
.pl-m .ic{width:16px;height:16px}
.pl-er{position:absolute;inset:0;display:grid;place-items:center;background:#000;color:#bbb;text-align:center;padding:16px}
.pl-er[hidden]{display:none}
.gs{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;background:#000;color:#fff;padding-top:env(safe-area-inset-top);animation:gin .2s ease-out}
@keyframes gin{from{transform:translateY(24px);opacity:0}}
.gs button{color:#fff}
.gs-x{width:48px;height:48px;margin:4px 4px 0;display:grid;place-items:center}
.gs-x .ic{width:26px;height:26px}
.gs-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px 14px}
.gs-h h2{margin:0;font-size:20px}
.gs-n{height:36px;padding:0 20px;border-radius:18px;background:#fff;color:#000!important;font-weight:600}
.gs-n[disabled]{opacity:.35;pointer-events:none}
.gs-g{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;align-content:start;padding-bottom:env(safe-area-inset-bottom)}
.gs-c,.gs-a{position:relative;aspect-ratio:1;overflow:hidden;background:#1a1a1a;display:block;width:100%}
.gs-a{display:grid;place-items:center;background:#222}
.gs-a .ic{width:34px;height:34px}
.gs-c video{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;border-radius:0;object-fit:cover;pointer-events:none}
.gs-c.on{outline:3px solid #7C3AED;outline-offset:-3px}
.gs-d{position:absolute;right:6px;bottom:6px;padding:1px 6px;border-radius:6px;background:rgba(0,0,0,.6);font-size:13px;font-weight:600}
.gs-ck{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:50%;background:#7C3AED;display:none;place-items:center}
.gs-ck .ic{width:15px;height:15px}
.gs-c.on .gs-ck{display:grid}
.gs-e{flex:1;display:grid;place-content:center;justify-items:center;gap:14px;padding:24px;color:#aaa;text-align:center}
.gs-e .ic{width:40px;height:40px}
.gs-b{height:44px;padding:0 26px;border-radius:22px;background:#7C3AED;font-weight:600}
.shm{position:relative;overflow:hidden;background:var(--s2)}
.shm::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--s3),transparent);transform:translateX(-100%);animation:shm 1.3s ease-in-out infinite}
@keyframes shm{to{transform:translateX(100%)}}
@media(prefers-reduced-motion:reduce){.shm::after{animation:none}}
.th.shm img{opacity:0}
.th img{transition:opacity .3s}
.skl .sl{display:grid;gap:8px;align-content:start}
.skl .sl i,.sk-l{display:block;height:14px;border-radius:6px}
.skl .sl i:last-child{width:60%}
.sk-l{margin:0}
.pg{display:flex;justify-content:center;align-items:center;gap:6px;margin:32px 0 8px;flex-wrap:wrap}
.pg[hidden]{display:none}
.pg button{min-width:38px;height:38px;padding:0 10px;border-radius:999px;background:var(--s2);font-weight:600;display:grid;place-items:center}
.pg button.on{background:#7C3AED;color:#fff}
.pg button[disabled]{opacity:.35;pointer-events:none}
.pg .gap{color:var(--mu);padding:0 2px}
.pg .ic{width:18px;height:18px}
@media(max-width:480px){.pg{gap:4px}.pg button{min-width:34px;height:36px;padding:0 8px}}
.btn.dlp{background:linear-gradient(90deg,var(--s3) var(--p,0%),var(--s2) var(--p,0%))}
.pk input{display:none}
.pz{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px dashed var(--s3);border-radius:12px;background:var(--s2);color:var(--mu);font-weight:500;cursor:pointer;transition:.15s}
.pz:hover{border-color:var(--link);color:var(--tx)}
.pz .ic{width:22px;height:22px}
.pz .pn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pz img{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none}
.pk.has .pz{border-style:solid;color:var(--tx)}
/* long-press prevention everywhere except text inputs */
*{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
a,img{-webkit-user-drag:none}
input:not([type=file]),textarea,[contenteditable],[contenteditable] *{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
::selection{background:transparent}
input::selection,textarea::selection{background:#3EA6FF55}
</style>
</head>

  <a class="logo" href="#/" aria-label="Vuzora home"><svg class="lm" viewBox="97 82 648 582" aria-hidden="true"><path fill="#7C3AED" d="M320 82 622 236V352L320 203ZM214 278 320 205V505L622 352 745 408 225 664 97 614 214 560Z"/></svg><span class="ln">Vuzora</span></a>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,updateProfile,sendPasswordResetEmail}from"https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

function ask(title,msg,ok='Confirm',danger){
  return new Promise(res=>{
    const o=document.createElement('div');o.className='ov';
    o.innerHTML=`<div class="sh" role="alertdialog" aria-modal="true"><h2>${esc(title)}</h2><p class="mu" style="margin:0 0 18px;font-size:14px">${esc(msg)}</p><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn" data-k="0">Cancel</button><button class="btn ${danger?'dg':'p'}" data-k="1">${esc(ok)}</button></div></div>`;
    const done=v=>{document.removeEventListener('keydown',kd);o.remove();res(v)};
    const kd=e=>{if(e.key=='Escape')done(false)};
    o.onmousedown=e=>{if(e.target===o)done(false)};
    o.querySelectorAll('button').forEach(b=>b.onclick=()=>done(b.dataset.k=='1'));
    document.addEventListener('keydown',kd);document.body.appendChild(o);o.querySelector('[data-k="1"]').focus();

}

function paged(box,items,render,st,per=12){
  let nav=box.nextElementSibling;if(!nav||!nav.classList.contains('pg')){nav=document.createElement('nav');nav.className='pg';nav.setAttribute('aria-label','Pagination');box.after(nav)}
  const pages=Math.max(1,Math.ceil(items.length/per));
  const draw=sc=>{
    st.p=Math.min(Math.max(1,st.p||1),pages);box.removeAttribute('aria-busy');
    render(items.slice((st.p-1)*per,st.p*per));
    nav.innerHTML='';nav.hidden=pages<2;if(pages<2)return;
    const b=(l,p,o={})=>{const e=document.createElement('button');e.innerHTML=l;e.setAttribute('aria-label',o.label||('Page '+p));if(o.on){e.className='on';e.setAttribute('aria-current','page')}if(o.dis)e.disabled=true;e.onclick=()=>{st.p=p;draw(true)};nav.appendChild(e)};
    b(icon('chevl'),st.p-1,{dis:st.p<=1,label:'Previous page'});
    let last=0;[...new Set([1,pages,st.p-1,st.p,st.p+1])].filter(n=>n>=1&&n<=pages).sort((x,y)=>x-y).forEach(n=>{
      if(n-last==2)b(last+1,last+1,{on:last+1==st.p});else if(n-last>2){const g=document.createElement('span');g.className='gap';g.textContent='…';nav.appendChild(g)}
      b(n,n,{on:n==st.p});last=n});
    b(icon('chevr'),st.p+1,{dis:st.p>=pages,label:'Next page'});
    if(sc)scrollTo({top:0,behavior:'smooth'});
  };
  draw();return draw;
}

function signIn(msg){
  const o=document.createElement('div');o.className='ov';
  o.innerHTML=`<form class="sh f"><h2>Sign in</h2><p class="mu">${esc(msg||'Sign in to like, comment, subscribe and upload.')}</p>
  <label hidden>Your name<input name="nm" maxlength="40"></label><label>Email<input name="em" type="email" autocomplete="email"></label><label>Password<input name="pw" type="password" autocomplete="current-password"></label>
  <p class="er" style="color:var(--hot);min-height:18px;margin:0 0 8px"></p><button class="btn p" style="width:100%;height:44px">Sign in</button>
  <p style="margin:14px 0 0"><button type="button" class="lk">New here? Create an account</button></p></form>`;
  document.body.appendChild(o);
  const f=o.firstChild,q=s=>f.querySelector(s);let up=false;
  o.onmousedown=e=>{if(e.target===o)o.remove()};
  q('.lk').onclick=()=>{up=!up;q('label').hidden=!up;q('h2').textContent=up?'Create your account':'Sign in';q('.btn').textContent=up?'Create account':'Sign in';q('.lk').textContent=up?'Have an account? Sign in':'New here? Create an account'};
  f.onsubmit=async e=>{
    e.preventDefault();const em=f.em.value.trim(),pw=f.pw.value,nm=f.nm.value.trim(),er=q('.er');er.textContent='';
    if(!em||!pw)return er.textContent='Enter your email and password.';
    if(up&&!nm)return er.textContent='Add the name people will see.';
    q('.btn').disabled=true;
    try{if(up){const c=await createUserWithEmailAndPassword(auth,em,pw);await updateProfile(c.user,{displayName:nm})}else await signInWithEmailAndPassword(auth,em,pw);o.remove();toast('Signed in')}
    catch(x){const c=x.code||'';er.textContent=/invalid-credential|user-not-found|wrong-password/.test(c)?'Wrong email or password.':/email-already/.test(c)?'That email already has an account.':/weak/.test(c)?'Use at least 6 characters.':x.message;q('.btn').disabled=false}
  };
  setTimeout(()=>f.em.focus(),50);
}

async function search(q,tk){

  $('#rh').textContent=`Results for “${q}”`;
  try{
    const w=q.toLowerCase().split(/\s+/).filter(Boolean),items=await pool();if(tk!==T)return;
    const hits=items.filter(v=>{const h=`${v.title} ${v.channelName} ${v.category||''} ${v.desc||''}`.toLowerCase();return w.every(x=>h.includes(x))});
    const score=v=>{const t=(v.title||'').toLowerCase(),c=(v.channelName||'').toLowerCase();let n=0;w.forEach(x=>{if(t.startsWith(x))n+=4;else if(t.includes(' '+x))n+=3;else if(t.includes(x))n+=2;if(c.includes(x))n+=1});return n};

  if(sheet)return;
  const inp=document.createElement('input');inp.type='file';inp.accept='video/*';inp.multiple=true;
  const urls=[];let files=[],sel=-1;
  const el=sheet=document.createElement('div');el.className='gs';
  el.innerHTML=`<div><button class="gs-x" aria-label="Close">${icon('close')}</button></div><div class="gs-h"><h2>Upload from gallery</h2><button class="gs-n" disabled>Next</button></div><div class="gs-e"></div>`;
  const g=el.querySelector('.gs-e'),nx=el.querySelector('.gs-n');
  const render=()=>{
    urls.splice(0).forEach(u=>URL.revokeObjectURL(u));g.innerHTML='';
    if(!files.length){g.className='gs-e';g.innerHTML=`${icon('upload')}<div>Choose videos from your gallery</div><button class="gs-b">Browse gallery</button>`;g.querySelector('button').onclick=()=>inp.click();nx.disabled=true;return}
    g.className='gs-g';
    const add=document.createElement('button');add.className='gs-a';add.setAttribute('aria-label','Add more videos');add.innerHTML=icon('plus');add.onclick=()=>inp.click();g.appendChild(add);
    files.forEach((f,i)=>{const u=URL.createObjectURL(f);urls.push(u);const c=document.createElement('button');c.className='gs-c'+(i===sel?' on':'');
      c.innerHTML=`<video muted playsinline preload="metadata" src="${u}#t=0.1"></video><span class="gs-d"></span><i class="gs-ck">${icon('check')}</i>`;
      const vv=c.querySelector('video');vv.onloadedmetadata=()=>{c.querySelector('.gs-d').textContent=dur(vv.duration)};
      c.onclick=()=>{sel=i;g.querySelectorAll('.gs-c').forEach((x,j)=>x.classList.toggle('on',j===i));nx.disabled=false};
      g.appendChild(c)});
    nx.disabled=sel<0;
  };
  inp.onchange=()=>{
    const all=[...inp.files],ok=all.filter(f=>/^video\//.test(f.type)||/\.(mp4|webm|mov|mkv|m4v|3gp)$/i.test(f.name));
    if(all.length&&!ok.length)toast('Please choose a video file.','error');
    files=files.concat(ok);if(sel<0&&files.length===1)sel=0;inp.value='';render();
  };
  const cleanup=()=>{urls.splice(0).forEach(u=>URL.revokeObjectURL(u));el.remove();sheet=null;document.body.style.overflow=''};
  const onPop=()=>{removeEventListener('popstate',onPop);cleanup();if(goUp){goUp=false;if(location.hash==='#/upload')route();else location.hash='#/upload'}};
  history.pushState({vzg:1},'',location.href);addEventListener('popstate',onPop);
  el.querySelector('.gs-x').onclick=()=>history.back();
  nx.onclick=()=>{if(sel<0)return;pendingFile=files[sel];goUp=true;history.back()};
  document.body.style.overflow='hidden';document.body.appendChild(el);render();
  inp.click();
}

/* upload */
const once=(e,n)=>new Promise((res,rej)=>{const t=setTimeout(()=>rej(new Error('Could not read this video.')),8000);e.addEventListener(n,()=>{clearTimeout(t);res()},{once:true})});
async function frame(f){
  const u=URL.createObjectURL(f),v=document.createElement('video');v.muted=true;v.playsInline=true;v.src=u;
  await once(v,'loadedmetadata');const d=v.duration||0;v.currentTime=Math.min(1,d/2);await once(v,'seeked');
  const c=document.createElement('canvas');c.width=640;c.height=360;const x=c.getContext('2d');x.fillRect(0,0,640,360);
  const k=Math.min(640/v.videoWidth,360/v.videoHeight),w=v.videoWidth*k,h=v.videoHeight*k;x.drawImage(v,(640-w)/2,(360-h)/2,w,h);URL.revokeObjectURL(u);
  return{duration:Math.round(d),blob:await new Promise(r=>c.toBlob(r,'image/jpeg',.8))};
}
const put=(path,blob,cb)=>new Promise((res,rej)=>{const t=uploadBytesResumable(sr(st,path),blob,{contentType:blob.type||'application/octet-stream',cacheControl:'public,max-age=31536000'});t.on('state_changed',s=>cb&&cb(s.bytesTransferred/s.totalBytes*100),rej,async()=>{try{res(await getDownloadURL(t.snapshot.ref))}catch(e){rej(e)}})});
function upload(){
  if(!me){V.innerHTML='<div class="empty"><b>Upload a video</b><br>Sign in to share your videos.<br><br><button class="btn p" id="si2">Sign in</button></div>';$('#si2').onclick=()=>signIn('Sign in to upload.');return}
  V.innerHTML=`<div class="f" style="max-width:640px;margin:0 auto"><h2>Upload a video</h2><p class="mu">MP4 or WebM, up to 600 MB.</p>
  <label class="pk">Video<input id="uf" type="file" accept="video/*"><span class="pz">${icon('upload')}<span class="pn">Choose a video</span></span></label><label>Title<input id="ut" maxlength="100"></label><label>Description<textarea id="ud" maxlength="2000"></textarea></label>
  <label>Category<select id="uc">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></label>
  <div class="bar"><i id="pb"></i></div><p class="mu" id="pt"></p><button class="btn p" id="up">Publish</button></div>`;
  $('#uf').onchange=e=>{const f=e.target.files[0];if(f&&!$('#ut').value)$('#ut').value=f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').slice(0,100)};
  if(pendingFile){try{const dt=new DataTransfer();dt.items.add(pendingFile);$('#uf').files=dt.files;$('#uf').dispatchEvent(new Event('change',{bubbles:true}))}catch(_){}pendingFile=null}
  $('#up').onclick=async()=>{
    const f=$('#uf').files[0],title=$('#ut').value.trim();
    if(!f||!/^video\//.test(f.type))return toast('Choose a video file.','error');
    if(!title)return toast('Add a title.','error');
    if(f.size>6e8)return toast('That file is over 600 MB.','error');
    $('#up').disabled=true;const setP=(p,t)=>{$('#pb').style.width=p+'%';$('#pt').textContent=t};
    const vid=push(ref(db,N.v)).key,uid=me.uid,tp=`vuzora/thumbs/${uid}/${vid}.jpg`,vp=`vuzora/videos/${uid}/${vid}_${f.name.replace(/[^a-zA-Z0-9.\-_]/g,'_').slice(-60)}`;
    try{
      setP(2,'Preparing…');const{blob,duration}=await frame(f);
      const thumbUrl=await put(tp,blob);
      const videoUrl=await put(vp,f,p=>setP(Math.max(4,p*.96),`Uploading… ${Math.round(p)}%`));
      setP(98,'Publishing…');
      await set(ref(db,`${N.v}/${vid}`),{uid,title,desc:$('#ud').value.trim(),category:$('#uc').value,tags:[],videoUrl,thumbUrl,videoPath:vp,thumbPath:tp,duration,views:0,likes:0,commentsCount:0,createdAt:Date.now(),channelName:(ch&&ch.name)||me.displayName||'Creator',channelPhoto:(ch&&ch.photo)||''});
      bump(`${N.c}/${uid}/videoCount`,1).catch(()=>{});P=null;toast('Published');location.hash=`#/watch/${vid}`;
    }catch(e){deleteObject(sr(st,tp)).catch(()=>{});deleteObject(sr(st,vp)).catch(()=>{});$('#up').disabled=false;setP(0,'');toast(/unauthorized|permission/i.test(e.code||e.message||'')?'Firebase blocked the upload. Check your Storage rules.':e.message,'error')}
  };
}

/* one view per signed-in account per video */
async function countView(id){
  if(!me)return;
  try{const r=ref(db,`${N.w}/${id}/${me.uid}`);if((await get(r)).exists())return;await set(r,Date.now());await bump(`${N.v}/${id}/views`,1)}catch(_){}
}

/* card previews: hover/focus on desktop, centred card on touch */
const touch=matchMedia('(hover:none)');let activeTh=null;const vis=new Set();let pt;
function stopPrev(){if(!activeTh)return;const v=activeTh.querySelector('.pvv');if(v){v.pause();v.removeAttribute('src');v.load();v.remove()}activeTh=null}
function preview(th){
  if(th===activeTh||!th.dataset.src||localStorage.getItem('vz_prev')==='0')return;stopPrev();
  const v=document.createElement('video');v.className='pvv';v.muted=true;v.loop=true;v.playsInline=true;v.setAttribute('playsinline','');v.src=th.dataset.src;
  th.insertBefore(v,th.querySelector('.d'));activeTh=th;v.play().catch(()=>{});
}
function pickTouch(){
  if(!touch.matches)return;let best=null,bd=1e9;
  vis.forEach(t=>{if(!t.isConnected){vis.delete(t);return}const r=t.getBoundingClientRect(),d=Math.abs(r.top+r.height/2-innerHeight/2);if(d<bd){bd=d;best=t}});
  best?preview(best):stopPrev();
}
const io=new IntersectionObserver(es=>{es.forEach(e=>e.isIntersecting?vis.add(e.target):vis.delete(e.target));clearTimeout(pt);pt=setTimeout(pickTouch,350)},{threshold:.6});
addEventListener('scroll',()=>{clearTimeout(pt);pt=setTimeout(pickTouch,350)},{passive:true});

/* settings */
async function sq(f){const b=await createImageBitmap(f),c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d'),k=Math.max(256/b.width,256/b.height),w=b.width*k,g=b.height*k;x.drawImage(b,(256-w)/2,(256-g)/2,w,g);return new Promise(r=>c.toBlob(r,'image/jpeg',.86))}
function settings(){
  const tp=localStorage.getItem('vz_theme')||'light',prev=localStorage.getItem('vz_prev')!=='0',nxt=localStorage.getItem('vz_next')!=='0';
  V.innerHTML=`<div class="st"><h2>Settings</h2>
  <section><h3>Account</h3>${me?`<div class="row" style="margin:0">${av(ch&&ch.photo,ch&&ch.name,48)}<div><b>${esc(ch?ch.name:me.displayName||'')}</b><div class="mu">${esc(me.email||'')}</div></div></div>`:'<p class="mu" style="margin:0">You are not signed in.</p>'}</section>
  <section><h3>Appearance</h3><div class="seg">${['light','dark','system'].map(t=>`<button data-t="${t}" class="${tp==t?'on':''}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></section>
  <section><h3>Playback</h3><label class="tg">Autoplay next video<input type="checkbox" id="sx" ${nxt?'checked':''}></label><label class="tg" style="margin-top:14px">Autoplay previews on cards<input type="checkbox" id="sp" ${prev?'checked':''}></label></section>
  <section><h3>Downloads</h3><p class="mu" style="margin:0 0 12px">Videos you download are kept inside Vuzora and can only be played here.</p><a class="btn" href="#/downloads">${icon('download')}Manage downloads</a></section>
  ${me?`<section class="f"><h3>Your channel</h3><label>Channel name<input id="sn" maxlength="40" value="${esc(ch?ch.name:'')}"></label><label>About<textarea id="sa" maxlength="500">${esc(ch?ch.about||'':'')}</textarea></label><label class="pk">Profile picture<input id="sf2" type="file" accept="image/*"><span class="pz">${icon('upload')}<span class="pn">Choose a photo</span></span></label><button class="btn p" id="ss">Save changes</button></section><section style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="rp">Reset password</button><button class="btn" id="so2">Sign out</button></section>`:'<section><button class="btn p" id="si5">Sign in</button></section>'}</div>`;
  V.querySelector('.seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;setTheme(b.dataset.t);V.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x==b))};
  $('#sp').onchange=e=>{localStorage.setItem('vz_prev',e.target.checked?'1':'0');if(!e.target.checked)stopPrev()};
  $('#sx').onchange=e=>localStorage.setItem('vz_next',e.target.checked?'1':'0');
  if(!me){$('#si5').onclick=()=>signIn();return}
  $('#rp').onclick=async()=>{try{await sendPasswordResetEmail(auth,me.email);toast('Reset link sent to '+me.email)}catch(e){toast(e.message,'error')}};
  $('#so2').onclick=async()=>{if(await ask('Sign out?','You can sign back in any time.','Sign out')){await signOut(auth);toast('Signed out','info')}};
  $('#ss').onclick=async()=>{
    const name=$('#sn').value.trim();if(!name)return toast('Your channel needs a name.','error');
    const b=$('#ss');b.disabled=true;
    try{
      const up={name,about:$('#sa').value.trim()},f=$('#sf2').files[0];
      if(f)up.photo=await put(`vuzora/media/${me.uid}/avatar_${Date.now()}.jpg`,await sq(f));
      await update(ref(db,`${N.c}/${me.uid}`),up);
      const s=await get(query(ref(db,N.v),orderByChild('uid'),equalTo(me.uid))),patch={};
      s.forEach(x=>{patch[`${N.v}/${x.key}/channelName`]=name;if(up.photo)patch[`${N.v}/${x.key}/channelPhoto`]=up.photo});
      if(Object.keys(patch).length)await update(ref(db),patch);
      ch={...ch,...up};P=null;chrome();toast('Settings saved');
    }catch(e){toast(e.message,'error')}finally{b.disabled=false}
  };
}


/* custom file picker feedback */
addEventListener('change',e=>{
  const i=e.target;if(!i.matches||!i.matches('.pk input[type=file]'))return;
  const l=i.closest('.pk'),z=l.querySelector('.pz'),f=i.files[0];
  const old=z.querySelector('img');if(old){URL.revokeObjectURL(old.src);old.remove()}
  l.classList.toggle('has',!!f);
  z.querySelector('.pn').textContent=f?f.name:(i.accept.startsWith('image')?'Choose a photo':'Choose a video');
  if(f&&f.type.startsWith('image/')){const m=new Image();m.src=URL.createObjectURL(f);z.prepend(m)}
});

/* block long-press menu / drag everywhere except text inputs */
addEventListener('contextmenu',e=>{if(!(e.target.closest&&e.target.closest('input:not([type=file]),textarea,[contenteditable]')))e.preventDefault()});
addEventListener('dragstart',e=>{if(e.target.closest&&e.target.closest('img,video,a'))e.preventDefault()});

/* router */
function route(){
  stopPrev();vis.clear();const p=document.querySelector('video');if(p)p.pause();blobs.splice(0).forEach(u=>URL.revokeObjectURL(u));
  const h=location.hash||'#/',tk=++T;let m;document.title='Vuzora';window.scrollTo(0,0);chrome();
  if(m=h.match(/^#\/watch\/([^/?]+)/))return watch(decodeURIComponent(m[1]),tk);
  if(m=h.match(/^#\/results\/(.*)$/))return search(decodeURIComponent(m[1]),tk);
  if(m=h.match(/^#\/channel\/([^/?]+)/))return channel(decodeURIComponent(m[1]),tk);
  if(h=='#/downloads')return downloads(tk);
  if(m=h.match(/^#\/downloads\/([^/?]+)/))return offline(decodeURIComponent(m[1]),tk);
  if(h=='#/settings')return settings();
  if(h=='#/upload')return upload();
  return home(tk);
}
addEventListener('hashchange',route);
/* collapsible search: icon only, expands over the logo, collapses on any outside tap */
const sf=$('#sf'),topbar=document.querySelector('.top');
function openSearch(){sf.classList.add('o');topbar.classList.add('so');$('#q').focus()}
function closeSearch(){sf.classList.remove('o');topbar.classList.remove('so');$('#q').blur()}
sf.querySelector('button').addEventListener('click',e=>{if(!sf.classList.contains('o')){e.preventDefault();openSearch()}});
addEventListener('pointerdown',e=>{if(sf.classList.contains('o')&&!(e.target.closest&&e.target.closest('#sf')))closeSearch()},true);
addEventListener('keydown',e=>{if(e.key==='Escape'&&sf.classList.contains('o'))closeSearch()});
let qT;
const goSearch=q=>{const h=`#/results/${encodeURIComponent(q)}`;if(location.hash===h)return;if(location.hash.startsWith('#/results/'))location.replace(h);else location.hash=h};
$('#q').addEventListener('input',()=>{clearTimeout(qT);const q=$('#q').value.trim();if(q)qT=setTimeout(()=>goSearch(q),250)});
sf.onsubmit=e=>{e.preventDefault();clearTimeout(qT);const q=$('#q').value.trim();if(q){goSearch(q);closeSearch()}};
onAuthStateChanged(auth,async u=>{me=u;ch=null;if(u){try{await ensureChannel(u)}catch(_){}}route()});
route();
</script>
